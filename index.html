<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{position:fixed;inset:0;overflow:hidden;background:#fff;color:#1c1c1e;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.3;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  --dot:rgba(0,0,0,.2);--panel:rgba(255,255,255,.94);--b:rgba(0,0,0,.09);--h:rgba(0,0,0,.06);--sel:#2f8cf5;}
:root.dark body{background:#1b1b1d;color:#ececec;--dot:rgba(255,255,255,.16);--panel:rgba(44,44,46,.95);--b:rgba(255,255,255,.12);--h:rgba(255,255,255,.09);}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
svg{display:block;}
#app{position:absolute;inset:0;display:flex;flex-direction:column;}

/* barra superior */
.top{display:flex;flex-wrap:wrap;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 54px 8px 10px;align-items:center;flex-shrink:0;z-index:2;}
.bar{display:flex;align-items:center;gap:2px;background:var(--panel);border-radius:22px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.12),0 0 0 .5px var(--b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);min-width:0;}
.bt{height:36px;min-width:36px;padding:0 10px !important;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.bt:hover{background:var(--h);}
.bt:disabled{opacity:.3;cursor:default;}
.bt svg{width:20px;height:20px;}
.crumb{padding:0 8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;}
.crumb i{font-style:normal;opacity:.4;margin:0 5px;}
.crumb a{cursor:pointer;}
.search{display:flex;align-items:center;gap:4px;flex:1 1 150px;min-width:130px;}
.search input{flex:1;min-width:0;height:36px;padding:0 8px !important;font-size:16px;outline:none;cursor:text !important;-webkit-user-select:text;user-select:text;}

/* cuerpo */
.body{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;}
.in{animation:in .22s ease-out;}
@keyframes in{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
.page{width:100%;padding:6px 12px 110px;}
.lh{font-size:22px;font-weight:800;padding:6px 4px 10px;}
.lh small{font-size:13px;font-weight:500;opacity:.55;margin-left:10px;}
.list{background:var(--panel);border-radius:14px;box-shadow:0 0 0 .5px var(--b);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px !important;text-align:left;border-bottom:.5px solid var(--b) !important;}
.row:last-child{border-bottom:0 !important;}
.row:hover{background:var(--h);}
.row .rn{flex:1;font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .rs{opacity:.5;font-size:13px;white-space:nowrap;}
.sq{width:28px;height:28px;border-radius:8px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.fh{border-radius:16px;padding:16px 18px;font-size:28px;font-weight:800;margin:6px 0 4px;}
.fd{opacity:.6;padding:0 4px 8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px;}
.chip{padding:6px 12px !important;border-radius:14px;background:var(--h) !important;font-size:14px;}
.chip.on{background:var(--sel) !important;color:#fff !important;}
.chips .sep{width:1px;background:var(--b);margin:0 4px;}
.sf{margin:14px 0 6px;font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:8px;}
.sf small{opacity:.5;font-weight:500;font-size:13px;}
.sf a{cursor:pointer;border-radius:8px;padding:2px 10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.card{position:relative;border-radius:10px;padding:10px 12px 12px;padding-right:46px;min-height:84px;color:#1c1c1e;box-shadow:0 1px 2px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.06);cursor:pointer;}
.card:active{filter:brightness(.96);}
.card b{display:block;font-size:15px;}
.card .an{display:block;font-size:13px;opacity:.75;margin-top:3px;line-height:1.3;}
.card .sb{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;margin-top:6px;}
.card .ck{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.55);}
.card .ck:hover{background:rgba(255,255,255,.9);}
.card .ck.on{background:#34c759;color:#fff;}
.card.done{box-shadow:0 0 0 2px #34c759;}
.empty{opacity:.55;padding:40px 10px;text-align:center;}
@media (max-width:560px){.grid{grid-template-columns:1fr;}.fh{font-size:22px;}.row .rs{max-width:38vw;overflow:hidden;text-overflow:ellipsis;}}

/* menú ⋯ */
.menu{position:fixed;z-index:8;display:none;min-width:236px;background:var(--panel);border-radius:18px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.22),0 0 0 .5px var(--b);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);}
.menu.open{display:block;}
.menu button{display:block;width:100%;text-align:left;padding:12px 14px !important;border-radius:12px;font-size:15px;}
.menu button:hover,.menu button:active{background:var(--h);}

/* nota amarilla */
.notebtn{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:52px;height:52px;border-radius:50% !important;background:#ffd400 !important;color:#1c1c1e !important;box-shadow:0 4px 16px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;}
.lad{position:fixed;z-index:7;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 24px));max-height:min(70vh,640px);display:none;flex-direction:column;background:var(--panel);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.3),0 0 0 .5px var(--b);overflow:hidden;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);}
.lad.open{display:flex;}
.lad .lhd{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;font-weight:700;font-size:15px;background:#ffd400;color:#1c1c1e;cursor:grab;touch-action:none;}
.lad .lhd span{flex:1;}
.lad .lhd button{background:rgba(0,0,0,.12) !important;width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;color:#1c1c1e;}
.lad .lb{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 14px;}
.lad .lt{font-weight:700;font-size:13px;margin:14px 0 4px;opacity:.65;}
.lad .li{display:flex;gap:10px;padding:5px 0;font-size:15px;line-height:1.3;}
.lad .li small{opacity:.6;font-size:13px;}
.lad .li .lk{width:18px;flex-shrink:0;opacity:.55;font-weight:700;}

/* aviso */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1c1c1e;color:#fff;border-radius:14px;padding:9px 16px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:.18s;z-index:999;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
:root.dark .toast{background:#ececec;color:#1c1c1e;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* nube de GitHub */
#ml-cloud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:60;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#8e8e93;}
#ml-cloud svg{width:23px;height:23px;}
#ml-cloud .slash{display:none;}
#ml-cloud.s-none{opacity:.75;}
#ml-cloud.s-none .slash{display:inline;}
#ml-cloud.s-pending{opacity:.6;}
#ml-cloud.s-sync{color:#2f8cf5;animation:pulse 1s ease-in-out infinite;}
#ml-cloud.s-off{color:#d9a400;}
#ml-cloud.s-err{color:#d32f2f;}
@keyframes pulse{50%{opacity:.35;}}
@media (prefers-reduced-motion:reduce){#ml-cloud.s-sync{animation:none;}.in{animation:none;}}
#ml-gh{position:fixed;inset:0;z-index:950;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.35);}
#ml-gh.open{display:flex;}
#ml-gh .g{background:var(--panel);color:inherit;border-radius:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:18px;font-size:14px;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.35);-webkit-user-select:text;user-select:text;}
:root.dark #ml-gh .g{background:#2c2c2e;}
#ml-gh h3{font-size:17px;margin:0 0 6px;}
#ml-gh .st{margin:6px 0 10px;opacity:.6;}
#ml-gh .er{color:#d32f2f;margin:8px 0;}
#ml-gh label{display:block;margin:10px 0 3px;opacity:.6;font-size:13px;}
#ml-gh input{width:100%;font-size:16px;padding:9px 10px !important;border:1px solid var(--b) !important;border-radius:10px;background:transparent;outline:none;cursor:text;}
#ml-gh .rw{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
#ml-gh .rw button{font-size:14px;padding:9px 14px !important;border-radius:10px;background:var(--h);font-weight:600;}
#ml-gh .rw button.pri{background:var(--sel);color:#fff;}
#ml-gh .rw button.dng{color:#d32f2f;}
#ml-gh .rw button:disabled{opacity:.5;}
#ml-gh details{margin-top:12px;opacity:.75;}
#ml-gh summary{cursor:pointer;}
#ml-gh ol{margin:8px 0 0 18px;}
#ml-gh li{margin:3px 0;}
</style>
</head>

<script>
// ── DATOS ──
// Cada elemento: [nombre (inglés, como lo verás en vídeos y en la wiki), nivel (b/i/a/e), tipo (t técnica / c concepto), qué es, cómo se hace]
const DATA = [
{ id:"suelo", name:"Movimiento en suelo", desc:"cómo te desplazas por el escenario — la base de todo lo demás", subs:[
  { name:"Desplazarse", items:[
    ["Walk",1,"t","andar; lento, pero puedes atacar, agarrar o protegerte en cualquier momento","stick inclinado a medias"],
    ["Dash",1,"t","arranque inicial de la carrera; rápido y fácil de cancelar","stick a fondo hacia un lado, de golpe"],
    ["Run",1,"t","carrera continua tras el dash inicial; desde aquí ya no puedes dar la vuelta al instante","mantener el stick tras el dash"],
    ["Crouch",1,"t","agacharse; reduce el impulso que recibes y es la salida rápida de la carrera","stick abajo"],
    ["Run cancel",2,"t","cortar la carrera agachándote para poder atacar, agarrar o protegerte antes","corriendo → stick abajo"],
    ["Turnaround",1,"t","darse la vuelta en el sitio sin moverse","toque suave del stick hacia atrás"],
  ]},
  { name:"Dash dance", items:[
    ["Dash dance",1,"t","encadenar dashes a izquierda y derecha para amenazar, esquivar y engañar","stick de lado a lado, a fondo, rápido"],
    ["Dashback",2,"t","dar la vuelta durante el dash inicial; es lo que hace posible el dash dance","stick al lado contrario dentro del dash (UCF lo hace fiable)"],
    ["Long dash dance",2,"t","dashes completos para cubrir mucho terreno","dejar que cada dash recorra toda su distancia"],
    ["Tight dash dance",2,"t","dashes muy cortos para amenazar sin moverte casi del sitio","cambiar de lado en los primeros frames de cada dash"],
    ["Foxtrot",2,"t","encadenar dashes iniciales en la misma dirección sin pasar a correr","dash → soltar → dash otra vez al mismo lado"],
  ]},
  { name:"Avanzado", items:[
    ["Pivot",3,"t","quedarte quieto mirando al otro lado justo tras un dash, listo para atacar como si estuvieras parado","dash → stick al lado contrario en el frame justo"],
    ["Pivot tilt",3,"t","pivot seguido de un tilt; ataque rápido mientras te alejas","pivot → tilt"],
    ["Moonwalk",4,"t","deslizarse hacia atrás con la animación de dash; más estilo que utilidad","media luna con el stick durante el dash"],
  ]},
]},
{ id:"aire", name:"Saltos y aire", desc:"despegar, moverse en el aire y caer cuando tú decides", subs:[
  { name:"Saltar", items:[
    ["Jumpsquat",1,"c","los frames de agacharse antes de despegar (de 3 a 9 según el personaje); en ellos puedes cancelar el salto","—"],
    ["Full hop",1,"t","salto completo","mantener X/Y"],
    ["Short hop",1,"t","salto corto; la base de casi todos los ataques aéreos en el suelo","pulsar y soltar X/Y antes de despegar"],
    ["Double jump",1,"t","segundo salto en el aire; no lo recuperas hasta tocar suelo o agarrar el borde","X/Y en el aire"],
    ["Tap jump",1,"t","saltar con el stick hacia arriba; en Melee siempre está activo","stick arriba de golpe"],
  ]},
  { name:"Controlar la caída", items:[
    ["Air drift",1,"t","moverse a los lados en el aire; cada personaje tiene su velocidad y aceleración","stick a los lados en el aire"],
    ["Fast fall",1,"t","caer mucho más rápido, para aterrizar antes o bajar a tiempo","stick abajo tras el punto más alto del salto"],
    ["Delayed fast fall",2,"t","retrasar el fast fall para cambiar el momento de tu aterrizaje y engañar","esperar y luego stick abajo"],
    ["Special fall",1,"c","caída indefensa tras un air dodge en el aire o un up-B; solo puedes desplazarte un poco y agarrar el borde","—"],
  ]},
]},
{ id:"wavedash", name:"Air dodge y wavedash", desc:"la esquiva aérea y el deslizamiento que define el movimiento de Melee", subs:[
  { name:"Air dodge", items:[
    ["Air dodge",1,"t","esquiva en el aire en la dirección que marques; después quedas en special fall","L/R en el aire + dirección"],
    ["Air dodge recovery",2,"t","usar el air dodge para acercarte al escenario como recuperación","L/R hacia el escenario"],
  ]},
  { name:"Wavedash", items:[
    ["Wavedash",2,"t","air dodge en diagonal contra el suelo justo al despegar: deslizas sin dejar de estar en el suelo y puedes hacer cualquier cosa de suelo","salto → L/R + diagonal abajo, al despegar"],
    ["Wavedash back",2,"t","wavedash hacia atrás: retirarte sin dejar de mirar al rival","salto → L/R + diagonal abajo-atrás"],
    ["Wavedash angle",2,"c","cuanto más horizontal la diagonal, más lejos deslizas; cuanto más vertical, más corto","—"],
    ["Perfect wavedash",3,"t","el ángulo más horizontal posible, para el máximo recorrido","diagonal casi horizontal (muesca)"],
    ["Wavedash out of shield",2,"t","salir del escudo deslizándote, para castigar o escapar","escudo → salto → L/R diagonal abajo"],
    ["Wavedash off ledge",3,"t","wavedash que te saca del escenario o plataforma, cayendo sin lag","wavedash hacia el borde"],
    ["Traction",2,"c","de la tracción del personaje depende cuánto desliza: Luigi muchísimo, otros muy poco","—"],
  ]},

/* --- conseguidos: { nombre: fecha ISO } --- */
const CK = 'ml_checks';
let checks = {}; try{ checks = JSON.parse(localStorage.getItem(CK) || '{}') || {}; }catch(e){ checks = {}; }
function saveChecks(){ try{ localStorage.setItem(CK, JSON.stringify(checks)); }catch(e){} window.mlDirty && window.mlDirty(); }
const isDone = n=> Object.prototype.hasOwnProperty.call(checks, n);
function toggle(n){ if(isDone(n)) delete checks[n]; else checks[n] = new Date().toISOString(); saveChecks(); return isDone(n); }

/* --- aviso --- */
const toastEl = $('#toast'); let tt;
function toast(m){ toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=> toastEl.classList.remove('show'), 1500); }
window.mlToast = toast;
function copy(n){
  const ok = ()=> toast(n);
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(n).then(ok, ()=>{ fallback(n); ok(); }); return; } }catch(e){}
  fallback(n); ok();
}
function fallback(n){ try{ const t = document.createElement('textarea'); t.value = n; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }catch(e){} }

/* --- navegación --- */
const body = $('#body'), qIn = $('#q');
let stack = [{ t: 'root' }], pos = 0, q = '', filt = { l: null, t: null, pend: false };
const cur = ()=> stack[pos];
function go(s){ stack = stack.slice(0, pos + 1); stack.push(s); pos++; render(true); }
function back(){ if(pos > 0){ pos--; render(true); } }
function fwd(){ if(pos < stack.length - 1){ pos++; render(true); } }

function crumb(){
  const s = cur(), c = $('.crumb');
  const root = `<a data-v="home">MELEE</a>`;
  c.innerHTML = s.t === 'root' ? 'MELEE' : s.t === 'fam' ? root + '<i>›</i>' + esc(DATA.find(f=> f.id === s.id).name) : root + '<i>›</i>Búsqueda';
  $('[data-v=back]').disabled = pos === 0; $('[data-v=fwd]').disabled = pos >= stack.length - 1;
}
function render(anim){
  crumb(); body.scrollTop = 0;
  const s = cur();
  if(s.t === 'root') renderRoot(); else if(s.t === 'fam') renderFam(DATA.find(f=> f.id === s.id)); else renderSearch();
  if(anim && body.firstElementChild) body.firstElementChild.classList.add('in');
}
function rerender(){ const y = body.scrollTop; render(false); body.scrollTop = y; }
window.mlRefresh = rerender;

/* --- portada --- */
function renderRoot(){
  const done = ALL.filter(x=> isDone(x.n)).length;
  const rows = DATA.map(f=>{ const it = famItems(f), d = it.filter(x=> isDone(x.n)).length; return `<button class="row" data-fam="${f.id}"><span class="sq" style="background:${f.color}"></span><span class="rn">${esc(f.name)}</span><span class="rs">${it.length}${d ? ' · ✓' + d : ''}</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="opacity:.35;flex-shrink:0"><path d="M9 5l7 7-7 7"/></svg></button>`; }).join('');
  body.innerHTML = `<div class="page"><div class="lh">MELEE<small>✓ ${done} / ${ALL.length}</small></div><div class="list">${rows}</div></div>`;
}

/* --- filtros y tarjetas --- */
const passes = x=> (!filt.l || x.l === filt.l) && (!filt.t || x.t === filt.t) && (!filt.pend || !isDone(x.n));
function chipsHTML(){
  return `<div class="chips">${[1,2,3,4].map(k=> `<button class="chip${filt.l === k ? ' on' : ''}" data-lv="${k}" style="${filt.l === k ? '' : 'box-shadow:inset 0 -3px 0 ' + NFILL[k]}">${NLAB[k]}</button>`).join('')}<span class="sep"></span>${Object.keys(TLAB).map(k=> `<button class="chip${filt.t === k ? ' on' : ''}" data-ty="${k}">${TLAB[k]}</button>`).join('')}<span class="sep"></span><button class="chip${filt.pend ? ' on' : ''}" data-pend="1">Sin conseguir</button></div>`;
}
function card(x){
  const d = isDone(x.n), how = x.h && x.h !== '—' ? x.h : '';
  return `<div class="card${d ? ' done' : ''}" data-name="${esc(x.n)}" style="background:${NFILL[x.l]}"><b>${esc(x.n)}</b><span class="an">${esc(x.d)}</span><span class="sb">${esc(NLAB[x.l])}${how ? ' · ' + esc(how) : ' · ' + esc(TLAB[x.t])}</span><button class="ck${d ? ' on' : ''}" data-ck="1" title="Marcar conseguido" aria-label="Marcar conseguido">✓</button></div>`;
}

/* --- una familia --- */
function renderFam(f){
  let h = `<div class="page"><div class="fh" style="background:${f.color};color:${isDark(f.color) ? '#fff' : '#1c1c1e'}">${esc(f.name)}</div><div class="fd">${esc(f.desc)}</div>${chipsHTML()}`, shown = 0;
  f.subs.forEach(s=>{
    const its = ALL.filter(x=> x.s === s && passes(x)); if(!its.length) return; shown += its.length;
    h += `<div class="sf">${esc(s.name)}<small>${its.length}</small></div><div class="grid">${its.map(card).join('')}</div>`;
  });
  if(!shown) h += `<div class="empty">Nada con estos filtros.</div>`;
  body.innerHTML = h + '</div>';
}

/* --- búsqueda --- */
function renderSearch(){
  const qq = norm(q.trim());
  let h = `<div class="page" style="padding-top:8px">${chipsHTML()}`, shown = 0;
  DATA.forEach(f=>{
    const its = famItems(f).filter(x=> passes(x) && (!qq || norm(x.n).includes(qq) || norm(x.d).includes(qq) || norm(x.h).includes(qq)));
    if(!its.length) return; shown += its.length;
    h += `<div class="sf"><a data-fam="${f.id}" style="background:${f.color};color:${isDark(f.color) ? '#fff' : '#1c1c1e'}">${esc(f.name)}</a><small>${its.length}</small></div><div class="grid">${its.map(card).join('')}</div>`;
  });
  if(!shown) h += `<div class="empty">Nada con «${esc(q)}».</div>`;
  body.innerHTML = h + '</div>';
}

/* --- nota amarilla: estructura de entrenamiento --- */
const lad = $('#lad');
function openLad(){
  lad.innerHTML = `<div class="lhd"><span>Estructura de entrenamiento</span><button data-ladx="1" aria-label="Cerrar">×</button></div><div class="lb">${TRAINING.map(([t, its])=> `<div class="lt">${esc(t)}</div>` + its.map(([n, d], i)=> `<div class="li"><span class="lk">${/^Principios/.test(t) ? '•' : i + 1}</span><span><b>${esc(n)}</b><small> — ${esc(d)}</small></span></div>`).join('')).join('')}</div>`;
  lad.classList.add('open');
}
function closeLad(){ lad.classList.remove('open'); }
(function(){ /* arrastrar la nota desde su cabecera */
  let drag = null;
  document.addEventListener('pointerdown', e=>{ const h = e.target.closest && e.target.closest('.lad .lhd'); if(!h || e.target.closest('button')) return; const r = lad.getBoundingClientRect(); drag = { dx: e.clientX - r.left, dy: e.clientY - r.top }; lad.style.right = 'auto'; lad.style.bottom = 'auto'; lad.style.left = r.left + 'px'; lad.style.top = r.top + 'px'; try{ h.setPointerCapture(e.pointerId); }catch(err){} });
  document.addEventListener('pointermove', e=>{ if(!drag) return; lad.style.left = Math.max(0, Math.min(innerWidth - 60, e.clientX - drag.dx)) + 'px'; lad.style.top = Math.max(0, Math.min(innerHeight - 40, e.clientY - drag.dy)) + 'px'; });
  document.addEventListener('pointerup', ()=>{ drag = null; });
})();

/* --- menú ⋯ --- */
const menu = $('#menu');
function closeMenu(){ menu.classList.remove('open'); }
function openMenu(btn){
  if(menu.classList.contains('open')){ closeMenu(); return; }
  const dark = document.documentElement.classList.contains('dark');
  menu.innerHTML = `<button data-mi="export">↓ Guardar copia (exportar)</button><button data-mi="import">↑ Cargar copia (importar)</button><button data-mi="theme">${dark ? '☀ Tema claro' : '☾ Tema oscuro'}</button><button data-mi="cloud">☁ Guardar en GitHub</button>`;
  const r = btn.getBoundingClientRect(); menu.classList.add('open');
  const w = menu.offsetWidth; menu.style.top = Math.round(r.bottom + 8) + 'px'; menu.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px';
}
function menuAct(a){
  closeMenu();
  if(a === 'theme'){ const d = !document.documentElement.classList.contains('dark'); document.documentElement.classList.toggle('dark', d); try{ localStorage.setItem('ml_theme', d ? 'dark' : 'light'); }catch(e){} }
  if(a === 'export'){
    const blob = new Blob([JSON.stringify({ format: 'melee-datos', version: 1, updated: new Date().toISOString(), checks }, null, 1)], { type: 'application/json' });
    const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = 'melee-datos-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=> URL.revokeObjectURL(u), 2000);
    toast('Copia guardada');
  }
  if(a === 'import') $('#imp').click();
  if(a === 'cloud' && window.mlSync) window.mlSync.openGh();
}
$('#imp').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(!o || o.format !== 'melee-datos' || typeof o.checks !== 'object' || Array.isArray(o.checks)) throw 0;
      if(!confirm('¿Juntar esta copia con lo que ya tienes marcado?\n\nNo se borra nada: solo se añaden los conseguidos de la copia.')) return;
      Object.entries(o.checks).forEach(([n, t])=>{ if(!isDone(n)) checks[n] = t || new Date().toISOString(); });
      saveChecks(); rerender(); toast('Copia cargada');
    }catch(err){ toast('Ese archivo no es una copia de MELEE'); }
  };
  r.readAsText(f); e.target.value = '';
});

/* --- clics --- */
document.addEventListener('click', e=>{
  const t = e.target;
  if(t.closest('[data-ladx]')){ closeLad(); return; }
  if(t.closest('#notebtn')){ lad.classList.contains('open') ? closeLad() : openLad(); return; }
  const mi = t.closest('[data-mi]'); if(mi){ menuAct(mi.dataset.mi); return; }
  if(!t.closest('#menu') && !t.closest('[data-v=menu]')) closeMenu();
  if(!t.closest('#app')) return;
  const v = t.closest('[data-v]'); if(v){ const a = v.dataset.v; if(a === 'back') back(); if(a === 'fwd') fwd(); if(a === 'home'){ q = ''; qIn.value = ''; if(cur().t !== 'root') go({ t: 'root' }); } if(a === 'menu') openMenu(v); return; }
  const fam = t.closest('[data-fam]'); if(fam){ go({ t: 'fam', id: fam.dataset.fam }); return; }
  const lv = t.closest('[data-lv]'); if(lv){ const k = +lv.dataset.lv; filt.l = filt.l === k ? null : k; rerender(); return; }
  const ty = t.closest('[data-ty]'); if(ty){ filt.t = filt.t === ty.dataset.ty ? null : ty.dataset.ty; rerender(); return; }
  if(t.closest('[data-pend]')){ filt.pend = !filt.pend; rerender(); return; }
  const c = t.closest('.card'); if(!c) return;
  const n = c.dataset.name;
  if(t.closest('[data-ck]')){ const on = toggle(n); if(filt.pend && on){ rerender(); } else { c.classList.toggle('done', on); t.closest('[data-ck]').classList.toggle('on', on); } toast(on ? 'Conseguido' : 'Desmarcado'); return; }
  copy(n);
});
qIn.addEventListener('input', e=>{
  q = e.target.value;
  if(!q.trim()){ if(cur().t === 'search') back(); return; }
  if(cur().t === 'search') render(false); else go({ t: 'search' });
});
document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(document.getElementById('ml-gh').classList.contains('open')) return;
  if(menu.classList.contains('open')){ closeMenu(); return; }
  if(lad.classList.contains('open')){ closeLad(); return; }
  if(e.target.matches('input')){ if(q){ q = ''; qIn.value = ''; if(cur().t === 'search') back(); } qIn.blur(); return; }
  back();
});
window.mlApply = function(m){ checks = m; try{ localStorage.setItem(CK, JSON.stringify(checks)); }catch(e){} rerender(); };
window.mlChecks = ()=> checks;

render(true);
const bh = document.getElementById('boot-hide');
if(bh) requestAnimationFrame(()=> requestAnimationFrame(()=> bh.remove()));
})();
</script>
<script>
/* ================= GUARDADO EN GITHUB =================
   Los conseguidos viven en melee-datos.json dentro de tu repositorio.
   Al marcar algo se sube a los pocos segundos; al abrir la app se baja lo último. Si dos aparatos cambian a la vez, se juntan. */
(function(){
"use strict";
const $ = (s, e)=> (e || document).querySelector(s);
const esc = s=> String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = JSON.stringify;
const CFG = 'ml_gh', BASEK = 'ml_sync_base', FILE = 'melee-datos.json';
let gh = null; try{ gh = JSON.parse(localStorage.getItem(CFG) || 'null'); }catch(e){}
const ghOk = ()=> !!(gh && gh.owner && gh.repo && gh.token && gh.branch);
const dirp = ()=> gh && gh.dir ? gh.dir.replace(/^\/+|\/+$/g, '') + '/' : '';
const apiBase = ()=> (gh && gh.api) || 'https://api.github.com';
let syncing = false, again = false, timer = 0, lastSync = 0, state = 'none', firstMode = null, lastMsg = '';
const toast = m=> window.mlToast && window.mlToast(m);

/* ---------- la nube ---------- */
const cloud = document.createElement('button'); cloud.id = 'ml-cloud'; cloud.setAttribute('aria-label', 'Guardado en GitHub');
cloud.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.6 9.1 4.75 4.75 0 0 0 7 18.5z"/><path class="slash" d="M4 4l16 16"/></svg>';
document.body.appendChild(cloud);
function titleOf(v){
  return { ok: 'Guardado en GitHub', sync: 'Guardando…', pending: 'Cambios por guardar', off: 'Sin conexión: se guardará al volver', err: 'No se pudo guardar' + (lastMsg ? ': ' + lastMsg : ''), none: 'Sin conectar: toca para guardar en GitHub' }[v] || '';
}
function setState(s, msg){
  state = s; lastMsg = msg || (s === 'err' ? lastMsg : '');
  const v = ghOk() ? s : 'none';
  cloud.className = 's-' + v; cloud.title = titleOf(v);
  const st = $('#mlg-state'); if(st) st.textContent = titleOf(v);
}

/* ---------- API de GitHub ---------- */
let trace = [];
function note(t){ trace.push(new Date().toLocaleTimeString('es-ES') + ' ' + t); if(trace.length > 6) trace.shift(); const d = $('#mlg-trace'); if(d) d.textContent = trace.join('\n'); }
async function ghApi(path, opt){
  opt = opt || {};
  const ctl = new AbortController(), to = setTimeout(()=> ctl.abort(), 25000), m = opt.method || 'GET';
  try{
    const r = await fetch(`${apiBase()}/repos/${gh.owner}/${gh.repo}${path}`, { method: m, cache: 'no-store', signal: ctl.signal,
      headers: Object.assign({ Authorization: 'Bearer ' + gh.token, Accept: opt.raw ? 'application/vnd.github.raw' : 'application/vnd.github+json' }, opt.body ? { 'Content-Type': 'application/json' } : {}),
      body: opt.body ? S(opt.body) : undefined });
    note(m + ' ' + r.status);
    if(!r.ok && r.status !== 404 || (r.status === 404 && m !== 'GET')){ try{ const j = await r.clone().json(); if(j && j.message) note('GitHub dice: ' + j.message); }catch(e){} }
    return r;
  }catch(e){
    note(m + ' ' + (ctl.signal.aborted ? 'sin respuesta (25 s)' : 'fallo de red: ' + (e && e.message || e)));
    throw new Error(ctl.signal.aborted ? 'GitHub no responde' : 'no se pudo hablar con GitHub (' + (e && e.message || e) + ')');
  }finally{ clearTimeout(to); }
}
const b64enc = str=> btoa(unescape(encodeURIComponent(str)));
const b64dec = b=> decodeURIComponent(escape(atob(b.replace(/\s/g, ''))));
function guessFromUrl(){
  const h = location.hostname.match(/^([^.]+)\.github\.io$/i); if(!h) return {};
  const parts = location.pathname.split('/').filter(Boolean); if(parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
  if(!parts.length) return { owner: h[1], repo: h[1] + '.github.io', dir: '' };
  return { owner: h[1], repo: parts[0], dir: parts.slice(1).join('/') };
}
function loadBase(){ try{ return JSON.parse(localStorage.getItem(BASEK) || 'null'); }catch(e){ return null; } }
function saveBase(o){ try{ localStorage.setItem(BASEK, S(o)); }catch(e){} }
const snap = ()=>{ const c = window.mlChecks ? window.mlChecks() : {}; const o = {}; Object.keys(c).sort().forEach(k=> o[k] = c[k] || ''); return o; };
const valid = o=> !!o && o.format === 'melee-datos' && o.checks && typeof o.checks === 'object' && !Array.isArray(o.checks);

/* ---------- fusión a tres bandas: lo último común (b), lo de aquí (l) y lo de GitHub (r) ---------- */
function mapMerge(b, l, r){
  const out = {}; l = l || {}; r = r || {};
  new Set([...Object.keys(l), ...Object.keys(r), ...Object.keys(b || {})]).forEach(k=>{
    const li = l[k], ri = r[k]; let v;
    if(!b) v = ri !== undefined ? ri : li;
    else { const bi = b[k], lc = S(li) !== S(bi), rc = S(ri) !== S(bi); v = !lc ? ri : !rc ? li : (li === undefined ? ri : ri === undefined ? li : li); }
    if(v !== undefined) out[k] = v;
  });
  const sorted = {}; Object.keys(out).sort().forEach(k=> sorted[k] = out[k]); return sorted;
}

/* ---------- sincronizar ---------- */
function scheduleSync(ms){ if(!ghOk()) return; clearTimeout(timer); setState('pending'); timer = setTimeout(sync, ms == null ? 900 : ms); }
window.mlDirty = ()=> scheduleSync();
async function sync(){
  if(!ghOk()) return;
  if(syncing){ again = true; return; }
  if(!navigator.onLine){ setState('off'); return; }
  syncing = true; setState('sync'); clearTimeout(timer);
  try{
    for(let tries = 0; tries < 3; tries++){
      const path = dirp() + FILE, r = await ghApi('/contents/' + path + '?ref=' + encodeURIComponent(gh.branch));
      if(r.status === 401) throw new Error('la llave no es válida o ha caducado');
      if(r.status === 403 || r.status === 429) throw new Error('GitHub no deja guardar ahora (' + r.status + ')');
      if(!r.ok && r.status !== 404) throw new Error('lectura ' + r.status);
      let remote = null, sha;
      if(r.ok){
        const j = await r.json(); sha = j.sha;
        let txt = j.content ? b64dec(j.content) : '';
        if(!txt){ const rr = await ghApi('/contents/' + path + '?ref=' + encodeURIComponent(gh.branch), { raw: true }); txt = await rr.text(); }
        let o = null; try{ o = JSON.parse(txt); }catch(e){}
        if(!valid(o)) throw new Error('el archivo ' + FILE + ' de GitHub no es de MELEE');
        remote = o.checks;
      }
      const base = loadBase(), local = snap();
      let merged;
      if(remote && firstMode === 'replace') merged = mapMerge(null, {}, remote);
      else if(remote) merged = mapMerge(base, local, remote);
      else merged = local;
      if(!remote || S(merged) !== S(mapMerge(null, {}, remote))){
        const body = { message: 'MELEE: ' + new Date().toLocaleString('es-ES'), content: b64enc(S({ format: 'melee-datos', version: 1, updated: new Date().toISOString(), checks: merged }, null, 1)), branch: gh.branch };
        if(sha) body.sha = sha;
        const p = await ghApi('/contents/' + path, { method: 'PUT', body });
        if(p.status === 409 || p.status === 422) continue;
        if(p.status === 401) throw new Error('la llave no es válida o ha caducado');
        if(p.status === 403 || p.status === 404) throw new Error('GitHub no deja escribir (' + p.status + '). Mira el motivo en el registro de abajo');
        if(!p.ok) throw new Error('escritura ' + p.status);
      }
      lastSync = Date.now();
      if(S(snap()) !== S(local)){ again = true; if(firstMode === 'replace') firstMode = 'merge'; setState('pending'); return; }
      if(S(merged) !== S(local) && window.mlApply) window.mlApply(merged);
      saveBase(merged); firstMode = null;
      setState('ok');
      return;
    }
    throw new Error('conflicto: otro aparato guardó a la vez');
  }catch(e){
    setState(!navigator.onLine ? 'off' : 'err', String(e && e.message || e));
  }finally{
    syncing = false;
    if(again){ again = false; scheduleSync(300); }
  }
}
addEventListener('online', ()=> scheduleSync(200));
addEventListener('offline', ()=> setState('off'));
document.addEventListener('visibilitychange', ()=>{
  if(!ghOk()) return;
  if(document.visibilityState === 'visible'){ if(Date.now() - lastSync > 5000) sync(); }
  else if(state === 'pending'){ clearTimeout(timer); sync(); }
});
addEventListener('pagehide', ()=>{ if(ghOk() && state === 'pending'){ clearTimeout(timer); sync(); } });
setInterval(()=>{ if(ghOk() && document.visibilityState === 'visible' && !syncing && state !== 'pending' && Date.now() - lastSync > 30000) sync(); }, 10000);

/* ---------- panel: conectar con GitHub ---------- */
const panel = document.createElement('div'); panel.id = 'ml-gh'; document.body.appendChild(panel);
function openGh(msg){
  const g = Object.assign(guessFromUrl(), gh || {});
  panel.innerHTML = `<div class="g" role="dialog" aria-label="Guardar en GitHub">
    <h3>☁ Guardar en GitHub</h3>
    <div class="st">${ghOk() ? 'Conectado. <span id="mlg-state"></span><pre id="mlg-trace" style="white-space:pre-wrap;font-size:11px;margin:6px 0 0;opacity:.8"></pre>' : 'Pega tu llave de GitHub y pulsa Conectar. El resto ya viene puesto si abres la app desde tu web.'}</div>
    <label for="mlg-token">Llave (token)</label><input id="mlg-token" type="password" value="${esc(g.token || '')}" placeholder="github_pat_…" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="mlg-owner">Usuario de GitHub</label><input id="mlg-owner" value="${esc(g.owner || '')}" placeholder="tu-usuario" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="mlg-repo">Repositorio</label><input id="mlg-repo" value="${esc(g.repo || '')}" placeholder="nombre-del-repositorio" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="mlg-dir">Carpeta dentro del repositorio (vacío si está en la raíz)</label><input id="mlg-dir" value="${esc(g.dir || '')}" placeholder="vacío" autocomplete="off" spellcheck="false" autocapitalize="off">
    ${msg ? `<div class="er">${esc(msg)}</div>` : ''}
    <div class="rw"><button class="pri" data-g="connect">${ghOk() ? 'Guardar cambios' : 'Conectar'}</button>${ghOk() ? '<button data-g="now">Sincronizar ahora</button><button class="dng" data-g="off">Desconectar este aparato</button>' : ''}<button data-g="close">Cerrar</button></div>
    <details><summary>¿Cómo creo la llave?</summary><ol>
      <li>En GitHub: tu foto → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>
      <li>«Repository access»: Only select repositories → elige el repositorio de MELEE.</li>
      <li>«Permissions» → Repository permissions → <b>Contents: Read and write</b>.</li>
      <li>Generar, copiar la llave (empieza por github_pat_) y pegarla aquí. Hay que hacerlo en cada aparato.</li></ol></details></div>`;
  panel.classList.add('open'); setState(state); note('(panel abierto)');
}
function closeGh(){ panel.classList.remove('open'); panel.innerHTML = ''; }
panel.addEventListener('click', async e=>{
  if(e.target === panel) return closeGh();
  const t = e.target.closest('[data-g]'); if(!t) return;
  const a = t.dataset.g;
  if(a === 'close') return closeGh();
  if(a === 'now'){ note('sincronizando…'); sync(); return; }
  if(a === 'off'){ gh = null; try{ localStorage.removeItem(CFG); localStorage.removeItem(BASEK); }catch(err){} clearTimeout(timer); setState('none'); closeGh(); toast('Este aparato ya no guarda en GitHub'); return; }
  if(a === 'connect'){
    const v = id=> $(id).value.trim();
    const cand = { token: v('#mlg-token'), owner: v('#mlg-owner'), repo: v('#mlg-repo').replace(/\.git$/, ''), dir: v('#mlg-dir').replace(/^\/+|\/+$/g, '') };
    if(gh && gh.api) cand.api = gh.api;
    if(!cand.token || !cand.owner || !cand.repo) return openGh('Faltan la llave, el usuario o el repositorio.');
    t.textContent = 'Comprobando…'; t.disabled = true;
    try{
      const base = cand.api || 'https://api.github.com';
      const r = await fetch(`${base}/repos/${cand.owner}/${cand.repo}`, { headers: { Authorization: 'Bearer ' + cand.token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
      if(r.status === 401) return openGh('La llave no es válida. Cópiala otra vez entera (empieza por github_pat_).');
      if(r.status === 404) return openGh('No encuentro ese repositorio, o la llave no tiene acceso a él. Revisa el usuario, el nombre del repositorio y que lo elegiste al crear la llave.');
      if(!r.ok) return openGh('GitHub ha respondido con un error (' + r.status + '). Prueba otra vez en un momento.');
      const j = await r.json();
      if(j.permissions && !j.permissions.push) return openGh('La llave puede leer pero no escribir. En la llave, el permiso «Contents» tiene que estar en «Read and write».');
      const same = gh && gh.owner === cand.owner && gh.repo === cand.repo && (gh.dir || '') === cand.dir;
      gh = Object.assign({}, cand, { branch: j.default_branch || 'main' });
      localStorage.setItem(CFG, S(gh));
      if(!same) localStorage.removeItem(BASEK);
      firstMode = null;
      if(!loadBase()){
        const fr = await ghApi('/contents/' + dirp() + FILE + '?ref=' + encodeURIComponent(gh.branch));
        if(fr.ok) firstMode = confirm('En GitHub ya hay datos de MELEE guardados.\n\nAceptar: usar en este aparato los de GitHub (lo que haya aquí se sustituye).\nCancelar: juntar lo de este aparato con lo de GitHub.') ? 'replace' : 'merge';
      }
      closeGh(); toast('Conectado con GitHub'); setState('pending'); sync();
    }catch(err){ openGh('No hay conexión con GitHub. Comprueba internet y vuelve a probar.'); }
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && panel.classList.contains('open')) closeGh(); });
cloud.addEventListener('click', ()=> openGh());
setState(ghOk() ? 'pending' : 'none'); if(ghOk()) sync();
window.mlSync = { sync, openGh, state: ()=> state };
})();
</script>
