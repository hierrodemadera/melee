<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{position:fixed;inset:0;overflow:hidden;background:#fff;color:#1c1c1e;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.3;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  --dot:rgba(0,0,0,.2);--panel:rgba(255,255,255,.94);--b:rgba(0,0,0,.09);--h:rgba(0,0,0,.06);--sel:#2f8cf5;--solid:#fff;--ink:#1c1c1e;--capon:#d6e8fe;}
:root.dark body{background:#1b1b1d;color:#ececec;--dot:rgba(255,255,255,.16);--panel:rgba(44,44,46,.95);--b:rgba(255,255,255,.12);--h:rgba(255,255,255,.09);--solid:#2c2c2e;--ink:#ececec;--capon:#1d3d63;}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
svg{display:block;}
#app{position:absolute;inset:0;display:flex;flex-direction:column;}

/* barra superior */
.top{display:flex;flex-wrap:wrap;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 54px 8px 10px;align-items:center;flex-shrink:0;z-index:2;}
.bar{display:flex;align-items:center;gap:2px;background:var(--panel);border-radius:22px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.12),0 0 0 .5px var(--b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);min-width:0;}
.bt{height:36px;min-width:36px;padding:0 10px !important;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.bt:hover{background:var(--h);}
.bt:disabled{opacity:.3;cursor:default;}
.bt svg{width:20px;height:20px;}
.crumb{padding:0 8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;}
.crumb i{font-style:normal;opacity:.4;margin:0 5px;}
.crumb a{cursor:pointer;}
.search{display:flex;align-items:center;gap:4px;flex:1 1 150px;min-width:130px;}
.search input{flex:1;min-width:0;height:36px;padding:0 8px !important;font-size:16px;outline:none;cursor:text !important;-webkit-user-select:text;user-select:text;}

.tabs{display:flex;gap:6px;padding:0 10px 8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 13px !important;flex-shrink:0;border-radius:16px;background:var(--h) !important;font-weight:600;white-space:nowrap;}
.tab.on{background:var(--sel) !important;color:#fff !important;}
/* cuerpo */
.body{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;}
.in{animation:in .22s ease-out;}
@keyframes in{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
.page{width:100%;padding:6px 12px 110px;}
.lh{font-size:22px;font-weight:800;padding:6px 4px 10px;}
.lh small{font-size:13px;font-weight:500;opacity:.55;margin-left:10px;}
.list{background:var(--panel);border-radius:14px;box-shadow:0 0 0 .5px var(--b);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px !important;text-align:left;border-bottom:.5px solid var(--b) !important;}
.row:last-child{border-bottom:0 !important;}
.row:hover{background:var(--h);}
.row .rn{flex:1;font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .rs{opacity:.5;font-size:13px;white-space:nowrap;}
.sq{width:28px;height:28px;border-radius:8px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.fh{border-radius:16px;padding:16px 18px;font-size:28px;font-weight:800;margin:6px 0 4px;}
.fd{opacity:.6;padding:0 4px 8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px;}
.chip{padding:6px 12px !important;border-radius:14px;background:var(--h) !important;font-size:14px;}
.chip.on{background:var(--sel) !important;color:#fff !important;}
.chips .sep{width:1px;background:var(--b);margin:0 4px;}
.sf{margin:14px 0 6px;font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:8px;}
.sf small{opacity:.5;font-weight:500;font-size:13px;}
.sf a{cursor:pointer;border-radius:8px;padding:2px 10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.card{position:relative;border-radius:10px;padding:10px 12px 12px;padding-right:46px;min-height:84px;color:#1c1c1e;box-shadow:0 1px 2px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.06);cursor:pointer;}
.card:active{filter:brightness(.96);}
.card b{display:block;font-size:15px;}
.card .an{display:block;font-size:13px;opacity:.75;margin-top:3px;line-height:1.3;}
.card .sb{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;margin-top:6px;}
.card .sb2{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;margin-top:4px;line-height:1.3;}
.card .sb2 span{opacity:.85;padding-top:1px;}
.card .sb2 i{display:inline-flex;gap:3px;flex-shrink:0;font-style:normal;}
.card .sb2 i b{display:inline-block;min-width:30px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.03em;line-height:1;padding:3px 5px;border-radius:5px;color:#fff;}
.card .sb2 .gc{background:#6a4fb3;}
.card .sb2 .ps{background:#0070d1;}
.card .sb2 .who{background:#8e8e93;}
.card .acts{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;}
.card .acts button{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.55);color:#1c1c1e;}
.card .acts button:hover{background:rgba(255,255,255,.9);}
.card .acts button.on{background:#34c759;color:#fff;}
/* rutinas */
.blk{border-radius:16px;padding:10px;margin:10px 0 14px;}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.dot{width:26px;height:26px;border-radius:50% !important;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.bn{flex:1;min-width:0;font-size:17px !important;font-weight:700;outline:none;padding:4px 2px !important;cursor:text !important;-webkit-user-select:text;user-select:text;}
.bc{opacity:.55;font-size:13px;white-space:nowrap;}

const COLORS = ['#2979ff','#00b8d4','#aa00ff','#ff5722','#2ecc40','#e91e63','#ffb300','#6d4c41','#00897b','#7cb342','#546e7a','#d81b60','#8e24aa','#f4511e','#3949ab','#9e9d24'];

const isDark = c=>{ const m = /^#?([0-9a-f]{6})$/i.exec(c); if(!m) return false; const n = parseInt(m[1], 16); return (((n >> 16) * 299) + (((n >> 8) & 255) * 587) + ((n & 255) * 114)) / 1000 < 140; };

/* --- elementos con su familia --- */
const ALL = [];
DATA.forEach((f, fi)=>{ f.color = f.color || COLORS[fi % COLORS.length]; f.subs.forEach(s=> s.items.forEach(a=>{ ALL.push({ n: a[0], l: a[1], t: a[2], d: a[3], h: a[4], f, s }); })); });
const famItems = f=> ALL.filter(x=> x.f === f);

const BYN = new Map(); ALL.forEach(x=> BYN.set(x.n, x));
const OLD = new Map(); DR.forEach(x=> OLD.set(x.n, x));
const RCOL = ['#2979ff','#ff5722','#2ecc40','#aa00ff','#ffb300','#00b8d4','#e91e63','#6d4c41','#546e7a'];

/* --- rutinas: { id: { name, color, items:[nombres], note, o } } --- */
const RK = 'ml_routines';
const normItem = x=> typeof x === 'string' ? x : x && x.h === 1 ? { h: 1, t: String(x.t || '') } : x && x.h === 2 ? { h: 2, t: String(x.t || ''), d: String(x.d || '') } : null;
const normR = r=> ({ name: String(r && r.name || ''), color: String(r && r.color || '#bdbdbd'), items: Array.isArray(r && r.items) ? r.items.map(normItem).filter(x=> x !== null) : [], note: String(r && r.note || ''), o: +(r && r.o) || 0 });
let routines = null; try{ routines = JSON.parse(localStorage.getItem(RK) || 'null'); }catch(e){}
if(!routines || typeof routines !== 'object' || Array.isArray(routines)){ routines = {}; Object.entries(ROUTINES_SEED).forEach(([id, r])=> routines[id] = normR(r)); try{ localStorage.setItem(RK, JSON.stringify(routines)); }catch(e){} }
else Object.keys(routines).forEach(id=> routines[id] = normR(routines[id]));
/* versión anterior: los ejercicios inventados pasan a ser subtítulos con sus fichas de la guía */
function migrate(){
  let ch = false;
  Object.keys(routines).forEach(id=>{
    const r = routines[id];
    if(!r.items.some(x=> typeof x === 'string' && OLD.has(x))) return;
    ch = true;
    if(ROUTINES_SEED[id]){ routines[id] = normR(Object.assign({}, ROUTINES_SEED[id], { name: r.name, color: r.color, o: r.o })); return; }
    const out = []; r.items.forEach(x=>{ if(typeof x === 'string' && OLD.has(x)){ const o = OLD.get(x); out.push({ h: 2, t: o.n, d: o.d }); o.techs.forEach(n=> out.push(n)); } else out.push(x); });
    r.items = out;
  });
  if(ch) try{ localStorage.setItem(RK, JSON.stringify(routines)); }catch(e){}
  return ch;
}
const migrated = migrate();
const rlist = ()=> Object.entries(routines).sort((a, b)=> a[1].o - b[1].o);
function saveR(){ try{ localStorage.setItem(RK, JSON.stringify(routines)); }catch(e){} window.mlDirty && window.mlDirty(); }

function snapR(){ undoSt.push(JSON.stringify(routines)); if(undoSt.length > 30) undoSt.shift(); }
const rName = r=> r.name || 'Rutina sin nombre';
function newRoutine(name){ const id = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), rl = rlist(); routines[id] = normR({ name, color: RCOL[rl.length % RCOL.length], items: ROUTINE_TEMPLATE, note: '', o: rl.length ? rl[rl.length - 1][1].o + 1 : 0 }); return id; }

const isDone = n=> Object.prototype.hasOwnProperty.call(checks, n);

const PSMAP = { 'X/Y': '○/△', 'L/R': 'L2/R2', 'C-stick': 'stick der.', 'up-B': 'up-B (arriba + ▢)', 'A': '✕', 'B': '▢', 'X': '○', 'Y': '△', 'Z': 'R1', 'L': 'L2', 'R': 'R2', 'Start': 'Options' };
function ps(h){
  const keep = [];
  let s = h.replace(/(?<![\wÀ-ÿ-])(X\/Y|L\/R|C-stick|up-B|Start|A|B|X|Y|Z|L|R)(?![\wÀ-ÿ\/-])/g, m=> '\u0001' + (keep.push(PSMAP[m]) - 1) + '\u0002');
  s = s.replace(/\bstick\b/g, 'stick izq.');
  return s.replace(/\u0001(\d+)\u0002/g, (_, i)=> keep[+i]);
}

const DIRS = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0], ne: [.71, -.71], nw: [-.71, -.71], se: [.71, .71], sw: [-.71, .71] };
function vec(s){
  const xy = s.split(','); if(xy.length === 2) return [+xy[0] || 0, +xy[1] || 0];
  const m = /^([nsew]{1,2})(\d*\.?\d*)$/.exec(s); if(!m || !DIRS[m[1]]) return null;
  const k = m[2] ? +m[2] : 1; return [DIRS[m[1]][0] * k, DIRS[m[1]][1] * k];
}
function parseAnim(str){
  let cap = '';
  return String(str).split('|').map(seg=>{
    const qi = seg.indexOf('"'); let own = null; if(qi >= 0){ own = seg.slice(qi + 1); seg = seg.slice(0, qi); }
    let d = 400; const at = seg.indexOf('@'); if(at >= 0){ d = +seg.slice(at + 1) || 400; seg = seg.slice(0, at); }
    const st = { b: {}, ls: null, rs: null, l2: 0, r2: 0, d, c: '' };
    seg.trim().split(/\s+/).filter(Boolean).forEach(tok=>{
      const m = /^(ls|rs):(.+)$/.exec(tok); if(m){ st[m[1]] = vec(m[2]); return; }
      const g = /^(l2|r2)(?::([\d.]+))?$/.exec(tok); if(g){ st[g[1]] = g[2] ? +g[2] : 1; return; }
      st.b[tok] = 1;
    });
    const busy = Object.keys(st.b).length || st.ls || st.rs || st.l2 || st.r2;
    if(own !== null) cap = own; else if(busy) cap = '';
    st.c = cap;
    return st;
  });
}
const STICK_C = { ls: [346, 322], rs: [514, 322] };
const KEYN = { x: '✕', o: '○', s: '▢', t: '△', r1: 'R1', l1: 'L1', opt: 'Options' };
const AR8 = ['→', '↘', '↓', '↙', '←', '↖', '↑', '↗'];
function arrow(v){
  const a = Math.atan2(v[1], v[0]), i = (Math.round(a / (Math.PI / 4)) + 8) % 8, off = a - Math.round(a / (Math.PI / 4)) * Math.PI / 4;
  if(Math.abs(off) < .12) return AR8[i];
  /* entre dos direcciones: la principal y "un poco" hacia la vecina (p. ej. → un poco ↓) */
  const ax = Math.abs(v[0]) >= Math.abs(v[1]), main = ax ? (v[0] > 0 ? '→' : '←') : (v[1] > 0 ? '↓' : '↑'), minor = ax ? (v[1] > 0 ? '↓' : '↑') : (v[0] > 0 ? '→' : '←');
  return Math.abs(Math.abs(v[0]) - Math.abs(v[1])) < .2 ? AR8[i] : main + ' un poco ' + minor;
}
function keysText(st){
  const p = [];
  if(st.ls) p.push('stick izq. ' + arrow(st.ls) + (Math.hypot(st.ls[0], st.ls[1]) < .6 ? ' suave' : ''));
  if(st.rs) p.push('stick der. ' + arrow(st.rs));
  ['l2', 'r2'].forEach(k=>{ if(st[k]) p.push(k.toUpperCase() + (st[k] < 1 ? ' a medias' : '')); });
  Object.keys(st.b).forEach(k=> p.push(KEYN[k] || k));
  return p.length ? p.join(' + ') : 'nada pulsado';
}
function padApply(svg, st){
  st = st || { b: {}, ls: null, rs: null, l2: 0, r2: 0 };
  svg.querySelectorAll('[data-k]').forEach(g=>{
    const k = g.dataset.k;
    if(k === 'l2' || k === 'r2'){ const a = st[k] || 0; g.classList.toggle('on', a > 0); g.style.setProperty('--a', a ? .35 + .65 * a : 0); g.style.transform = `translateY(${a * 9}px)`; return; }
    if(k === 'ls' || k === 'rs'){
      const v = st[k], cap = g.querySelector('.pk-cap'), dir = g.querySelector('.pk-dir'), [cx, cy] = STICK_C[k];
      g.classList.toggle('on', !!v);
      cap.style.transform = v ? `translate(${v[0] * 18}px,${v[1] * 18}px)` : '';
      const m = Math.hypot(v ? v[0] : 0, v ? v[1] : 0) || 1, ux = v ? v[0] / m : 0, uy = v ? v[1] / m : 0, L = 60 + 14 * Math.min(1, m), tx = cx + ux * L, ty = cy + uy * L;
      dir.setAttribute('d', v ? `M${cx} ${cy} L${tx} ${ty} M${tx - ux * 9 - uy * 6} ${ty - uy * 9 + ux * 6} L${tx} ${ty} L${tx - ux * 9 + uy * 6} ${ty - uy * 9 - ux * 6}` : `M${cx} ${cy} L${cx} ${cy}`);
      return;
    }
    g.classList.toggle('on', !!st.b[k]);
  });
}

const play = $('#play'); let pl = null;
function playerHTML(n){
  return `<div class="plcap"></div><div class="plkeys"></div><div class="pldots">${Array.from({ length: n }, (_, i)=> `<i data-i="${i}"></i>`).join('')}</div>

}
function startPlayer(box, svg, name){
  stopPlayer();
  const steps = parseAnim(ANIM[name]); if(!steps.length) return;
  box.innerHTML = playerHTML(steps.length);
  pl = { steps, i: -1, spd: 1, run: true, t: 0, svg, box, name };
  plNext();
}
function stopPlayer(){ if(pl){ clearTimeout(pl.t); padApply(pl.svg, null); pl = null; } }
function openPlay(name){
  play.innerHTML = `<div class="pk" role="dialog"><div class="pkh"><span>${esc(name)}</span><button data-plx="1">Cerrar</button></div><div class="padwrap">${PAD}</div><div class="plbox"></div></div>`;
  play.classList.add('open');
  startPlayer($('.plbox', play), $('svg', play), name);
}
function plShow(i){
  pl.i = i; const st = pl.steps[i];
  padApply(pl.svg, st);
  $('.plcap', pl.box).textContent = st.c || ' ';
  $('.plkeys', pl.box).textContent = keysText(st);
  pl.box.querySelectorAll('.pldots i').forEach((d, k)=> d.classList.toggle('on', k === i));
}
function plNext(){
  if(!pl) return; clearTimeout(pl.t);
  if(pl.i >= pl.steps.length - 1){ padApply(pl.svg, null); pl.i = -1; if(pl.run){ pl.t = setTimeout(plNext, 650 / pl.spd); return; } }
  plShow(pl.i + 1);
  if(pl.run) pl.t = setTimeout(plNext, pl.steps[pl.i].d / pl.spd);
}
function plSetRun(r){ pl.run = r; $('.pltog', pl.box).textContent = r ? '❚❚' : '▶'; clearTimeout(pl.t); if(r) pl.t = setTimeout(plNext, 300 / pl.spd); }
function closePlay(){ if(!play.classList.contains('open')) return; stopPlayer(); play.classList.remove('open'); play.innerHTML = ''; }
play.addEventListener('click', e=>{ if(e.target === play || e.target.closest('[data-plx]')) closePlay(); });
document.addEventListener('click', e=>{
  if(!pl || !e.target.closest || !pl.box.contains(e.target)) return;
  const b = e.target.closest('[data-pl]'), s = e.target.closest('[data-spd]'), dot = e.target.closest('.pldots i');
  if(s){ pl.spd = +s.dataset.spd; pl.box.querySelectorAll('[data-spd]').forEach(c=> c.classList.toggle('on', c === s)); if(pl.run){ clearTimeout(pl.t); pl.t = setTimeout(plNext, pl.steps[Math.max(pl.i, 0)].d / pl.spd); } return; }
  if(dot){ plSetRun(false); plShow(+dot.dataset.i); return; }
  if(!b) return;
  const a = b.dataset.pl;
  if(a === 'toggle'){ plSetRun(!pl.run); return; }
  plSetRun(false);
  if(a === 'next') plShow(pl.i >= pl.steps.length - 1 ? 0 : pl.i + 1);
  if(a === 'prev') plShow(pl.i <= 0 ? pl.steps.length - 1 : pl.i - 1);
});

    const flush = ()=>{ if(grid.length){ inner += `<div class="grid">${grid.join('')}</div>`; grid = []; } };
    r.items.forEach((x, i)=>{
      if(typeof x === 'string'){ grid.push(card(BYN.get(x) || { n: x, l: 0, t: 'x', d: 'ya no está en la guía', h: '' }, false, i)); return; }
      flush();
      if(x.h === 1) inner += `<div class="rh1" data-ii="${i}"><input class="rt1" data-hed="t" value="${esc(x.t)}" placeholder="título…" autocomplete="off" spellcheck="false">${HB(i, i === 0)}</div>`;
      else inner += `<div class="rh2" data-ii="${i}"><div class="rh2a"><input class="rt2" data-hed="t" value="${esc(x.t)}" placeholder="ejercicio…" autocomplete="off" spellcheck="false">${HB(i, i === 0)}</div><textarea class="rd2" data-hed="d" rows="1" placeholder="explicación del ejercicio…">${esc(x.d)}</textarea></div>`;
    });
    flush();
    h += `<div class="blk" data-rid="${id}" style="background:${r.color}29;border:1px solid ${r.color}8c">
      <div class="bh"><button class="dot" data-rcol="1" style="background:${r.color}" title="Cambiar color" aria-label="Cambiar color"></button><input class="bn" data-rname="1" value="${esc(r.name)}" placeholder="nombre de la rutina…" autocomplete="off" spellcheck="false"><span class="bc">${nCards(r)}</span><button class="chip" data-rdel="1" title="Borrar rutina" aria-label="Borrar rutina">×</button></div>
      ${inner}
      <div class="chips" style="padding-top:10px"><button class="chip" data-radd="1">+ fichas</button><button class="chip" data-rh="1">+ título</button><button class="chip" data-rh="2">+ subtítulo</button></div>
      <textarea class="bnote" data-rnote="1" placeholder="notas, objetivos, referencias…">${esc(r.note)}</textarea></div>`;
  });
  h += `<button class="chip" data-rnew="1" style="margin:12px 0;padding:10px 16px !important;font-weight:700">+ nueva rutina</button>`;
  body.innerHTML = h + '</div>';

}
function fit(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
/* fin de la sección que empieza en el título/subtítulo i: antes del siguiente título del mismo nivel o superior */
function sectionEnd(r, i){
  const lv = r.items[i].h;
  for(let j = i + 1; j < r.items.length; j++){ const x = r.items[j]; if(typeof x !== 'string' && x.h <= lv) return j; }
  return r.items.length;
}
function addTo(id, n){
  const r = routines[id]; if(!r) return;

}
function addFlow(n, btn){
  const rl = rlist();
  if(!rl.length){ snapR(); const id = newRoutine('Mi rutina'); routines[id].items.push(n); saveR(); toast('Añadido a Mi rutina'); return; }
  if(rl.length === 1){ addTo(rl[0][0], n); return; }
  menu.innerHTML = `<div style="padding:8px 14px 4px;font-size:13px;opacity:.55">Añadir al final de…</div>` + rl.map(([id, r])=> `<button data-addto="${id}" data-addn="${esc(n)}"><span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:${r.color};margin-right:10px;vertical-align:-1px"></span>${esc(rName(r))}${r.items.includes(n) ? ' ✓' : ''}</button>`).join('');

/* --- elegir fichas de la guía para una rutina --- */
const pick = $('#pick'); let pickId = null, pickQ = '', pickAt = 0, pickWhere = '';
function openPick(id, at, where){
  pickId = id; pickQ = ''; pickAt = at; pickWhere = where || '';
  pick.innerHTML = `<div class="pk" role="dialog"><div class="pkh"><span></span><button data-pkx="1">Listo</button></div><div class="pks"><input type="search" id="pkq" placeholder="buscar ficha…" autocomplete="off" spellcheck="false"></div><div class="pkl" id="pkl"></div></div>`;

}
function drawPick(){
  const r = routines[pickId]; if(!r){ closePick(); return; }
  $('.pkh span', pick).textContent = 'Añadir a ' + (pickWhere ? '«' + pickWhere + '»' : '«' + rName(r) + '»');
  const qq = norm(pickQ.trim()), hit = x=> !qq || norm(x.n).includes(qq) || norm(x.d).includes(qq);
  const sec0 = r.items.slice(0, pickAt);
  const row = x=> { const inn = sec0.lastIndexOf(x.n) > -1 && sec0.slice(sec0.lastIndexOf(x.n)).every(y=> typeof y === 'string'); return `<button class="prow${inn ? ' in' : ''}" data-pn="${esc(x.n)}"><span class="pd" style="background:${NFILL[x.l]}"></span><span class="pn">${esc(x.n)}<small>${esc(x.f.name)}</small></span><span class="pi">${inn ? '✓' : '+'}</span></button>`; };
  const sec = (title, its)=> its.length ? `<div class="pkt">${title}</div>` + its.map(row).join('') : '';
  const h = sec('Mando', ALL.filter(x=> x.t === 'm' && hit(x))) + sec('Técnica', ALL.filter(x=> x.t === 't' && hit(x))) + sec('Conceptos', ALL.filter(x=> x.t === 'c' && hit(x)));
  $('#pkl').innerHTML = h || `<div class="empty">Nada con «${esc(pickQ)}».</div>`;
}
function closePick(){ if(!pick.classList.contains('open')) return; pick.classList.remove('open'); pick.innerHTML = ''; pickId = null; if(ty() === 'r') rerender(); }
pick.addEventListener('click', e=>{
  if(e.target === pick || e.target.closest('[data-pkx]')){ closePick(); return; }

});
pick.addEventListener('input', e=>{ if(e.target.id === 'pkq'){ pickQ = e.target.value; drawPick(); } });

/* --- una familia (solo lo de la pestaña actual) --- */
function renderFam(f){

}

/* --- búsqueda (en la pestaña actual) --- */
function renderSearch(){
  const k = ty(), qq = norm(q.trim()), hit = x=> !qq || norm(x.n).includes(qq) || norm(x.d).includes(qq) || norm(x.h).includes(qq) || (x.techs && norm(x.techs.join(' ')).includes(qq));
  let h = `<div class="page" style="padding-top:8px">${chipsHTML()}`, shown = 0;

/* --- menú ⋯ --- */
const menu = $('#menu');

  const dark = document.documentElement.classList.contains('dark');

function menuAct(a){
  closeMenu();
  if(a === 'theme'){ const d = !document.documentElement.classList.contains('dark'); document.documentElement.classList.toggle('dark', d); try{ localStorage.setItem('ml_theme', d ? 'dark' : 'light'); }catch(e){} }

$('#imp').addEventListener('change', e=>{

    try{

      if(o.routines && typeof o.routines === 'object' && !Array.isArray(o.routines)){ snapR(); Object.entries(o.routines).forEach(([id, r])=>{ if(!routines[id]) routines[id] = normR(r); }); saveR(); }

/* --- clics --- */
document.addEventListener('click', e=>{
  const t = e.target;

  const fam = t.closest('[data-fam]'); if(fam){ go({ t: 'fam', id: fam.dataset.fam }); return; }

  if(t.closest('[data-all]')){ go({ t: 'all' }); return; }
  const pk = t.closest('#padm [data-k]'); if(pk){ padInfo(pk.dataset.k); return; }
  const tb = t.closest('[data-tab]'); if(tb){ if(cur().t === 'search'){ stack[pos].ty = tb.dataset.tab; render(true); } else if(!(cur().t === 'root' && ty() === tb.dataset.tab)) go({ t: 'root', ty: tb.dataset.tab }); return; }

  if(t.closest('[data-rnew]')){ snapR(); const id = newRoutine(''); saveR(); rerender(); const inp = $(`[data-rid="${id}"] [data-rname]`); if(inp){ inp.scrollIntoView({ block: 'center' }); inp.focus(); } return; }

  if(R && t.closest('[data-rdel]')){ if(!confirm('¿Borrar la rutina «' + rName(R) + '»?')) return; snapR(); delete routines[rid]; saveR(); rerender(); toast('Rutina borrada · ↶ para deshacer'); return; }

  const ha = t.closest('[data-hadd]'); if(R && ha){ const i = +ha.dataset.hadd; openPick(rid, sectionEnd(R, i), R.items[i].t || (R.items[i].h === 1 ? 'título' : 'ejercicio')); return; }
  if(R && t.closest('[data-rm]')){ const i = +t.closest('[data-rm]').dataset.rm, x = R.items[i]; if(typeof x !== 'string' && (x.t || x.d) && !confirm('¿Quitar «' + (x.t || 'sin nombre') + '»? Sus fichas se quedan.')) return; snapR(); R.items.splice(i, 1); saveR(); rerender(); return; }

  copy(n);
});
document.addEventListener('input', e=>{

window.mlApply = function(m){

<script>
/* ================= GUARDADO EN GITHUB =================
   Los conseguidos y las rutinas viven en melee-datos.json dentro de tu repositorio.
   Al marcar algo se sube a los pocos segundos; al abrir la app se baja lo último. Si dos aparatos cambian a la vez, se juntan. */
(function(){
"use strict";
const $ = (s, e)=> (e || document).querySelector(s);
const esc = s=> String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = JSON.stringify;
const CFG = 'ml_gh', BASEK = 'ml_sync_base', FILE = 'melee-datos.json';
let gh = null; try{ gh = JSON.parse(localStorage.getItem(CFG) || 'null'); }catch(e){}
const ghOk = ()=> !!(gh && gh.owner && gh.repo && gh.token && gh.branch);
const dirp = ()=> gh && gh.dir ? gh.dir.replace(/^\/+|\/+$/g, '') + '/' : '';
const apiBase = ()=> (gh && gh.api) || 'https://api.github.com';
let syncing = false, again = false, timer = 0, lastSync = 0, state = 'none', firstMode = null, lastMsg = '';
const toast = m=> window.mlToast && window.mlToast(m);

/* ---------- la nube ---------- */
const cloud = document.createElement('button'); cloud.id = 'ml-cloud'; cloud.setAttribute('aria-label', 'Guardado en GitHub');
cloud.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.6 9.1 4.75 4.75 0 0 0 7 18.5z"/><path class="slash" d="M4 4l16 16"/></svg>';
document.body.appendChild(cloud);
function titleOf(v){
  return { ok: 'Guardado en GitHub', sync: 'Guardando…', pending: 'Cambios por guardar', off: 'Sin conexión: se guardará al volver', err: 'No se pudo guardar' + (lastMsg ? ': ' + lastMsg : ''), none: 'Sin conectar: toca para guardar en GitHub' }[v] || '';
}
function setState(s, msg){
  state = s; lastMsg = msg || (s === 'err' ? lastMsg : '');
  const v = ghOk() ? s : 'none';
  cloud.className = 's-' + v; cloud.title = titleOf(v);
  const st = $('#mlg-state'); if(st) st.textContent = titleOf(v);
}

/* ---------- API de GitHub ---------- */
let trace = [];
function note(t){ trace.push(new Date().toLocaleTimeString('es-ES') + ' ' + t); if(trace.length > 6) trace.shift(); const d = $('#mlg-trace'); if(d) d.textContent = trace.join('\n'); }
async function ghApi(path, opt){
  opt = opt || {};
  const ctl = new AbortController(), to = setTimeout(()=> ctl.abort(), 25000), m = opt.method || 'GET';
  try{
    const r = await fetch(`${apiBase()}/repos/${gh.owner}/${gh.repo}${path}`, { method: m, cache: 'no-store', signal: ctl.signal,
      headers: Object.assign({ Authorization: 'Bearer ' + gh.token, Accept: opt.raw ? 'application/vnd.github.raw' : 'application/vnd.github+json' }, opt.body ? { 'Content-Type': 'application/json' } : {}),
      body: opt.body ? S(opt.body) : undefined });
    note(m + ' ' + r.status);
    if(!r.ok && r.status !== 404 || (r.status === 404 && m !== 'GET')){ try{ const j = await r.clone().json(); if(j && j.message) note('GitHub dice: ' + j.message); }catch(e){} }
    return r;
  }catch(e){
    note(m + ' ' + (ctl.signal.aborted ? 'sin respuesta (25 s)' : 'fallo de red: ' + (e && e.message || e)));
    throw new Error(ctl.signal.aborted ? 'GitHub no responde' : 'no se pudo hablar con GitHub (' + (e && e.message || e) + ')');
  }finally{ clearTimeout(to); }
}
const b64enc = str=> btoa(unescape(encodeURIComponent(str)));
const b64dec = b=> decodeURIComponent(escape(atob(b.replace(/\s/g, ''))));
function guessFromUrl(){
  const h = location.hostname.match(/^([^.]+)\.github\.io$/i); if(!h) return {};
  const parts = location.pathname.split('/').filter(Boolean); if(parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
  if(!parts.length) return { owner: h[1], repo: h[1] + '.github.io', dir: '' };
  return { owner: h[1], repo: parts[0], dir: parts.slice(1).join('/') };
}
function loadBase(){ try{ return JSON.parse(localStorage.getItem(BASEK) || 'null'); }catch(e){ return null; } }
function saveBase(o){ try{ localStorage.setItem(BASEK, S(o)); }catch(e){} }
const sortMap = m=>{ const o = {}; Object.keys(m || {}).sort().forEach(k=> o[k] = m[k]); return o; };
const nrMap = m=>{ const o = {}; Object.keys(m || {}).sort().forEach(k=> o[k] = window.mlNormR(m[k])); return o; };
const ckMap = m=>{ const o = {}; Object.keys(m || {}).sort().forEach(k=> o[k] = m[k] || ''); return o; };
const snap = ()=>{ const d = window.mlData(); return { c: ckMap(d.c), r: nrMap(d.r) }; };
const valid = o=> !!o && o.format === 'melee-datos' && o.checks && typeof o.checks === 'object' && !Array.isArray(o.checks);

/* ---------- fusión a tres bandas: lo último común (b), lo de aquí (l) y lo de GitHub (r) ---------- */
function mapMerge(b, l, r){
  const out = {}; l = l || {}; r = r || {};
  new Set([...Object.keys(l), ...Object.keys(r), ...Object.keys(b || {})]).forEach(k=>{
    const li = l[k], ri = r[k]; let v;
    if(!b) v = ri !== undefined ? ri : li;
    else { const bi = b[k], lc = S(li) !== S(bi), rc = S(ri) !== S(bi); v = !lc ? ri : !rc ? li : (li === undefined ? ri : ri === undefined ? li : li); }
    if(v !== undefined) out[k] = v;
  });
  const sorted = {}; Object.keys(out).sort().forEach(k=> sorted[k] = out[k]); return sorted;
}

/* ---------- sincronizar ---------- */
function scheduleSync(ms){ if(!ghOk()) return; clearTimeout(timer); setState('pending'); timer = setTimeout(sync, ms == null ? 900 : ms); }
window.mlDirty = ()=> scheduleSync();
async function sync(){
  if(!ghOk()) return;
  if(syncing){ again = true; return; }
  if(!navigator.onLine){ setState('off'); return; }
  syncing = true; setState('sync'); clearTimeout(timer);
  try{
    for(let tries = 0; tries < 3; tries++){
      const path = dirp() + FILE, r = await ghApi('/contents/' + path + '?ref=' + encodeURIComponent(gh.branch));
      if(r.status === 401) throw new Error('la llave no es válida o ha caducado');
      if(r.status === 403 || r.status === 429) throw new Error('GitHub no deja guardar ahora (' + r.status + ')');
      if(!r.ok && r.status !== 404) throw new Error('lectura ' + r.status);
      let remote = null, sha;
      if(r.ok){
        const j = await r.json(); sha = j.sha;
        let txt = j.content ? b64dec(j.content) : '';
        if(!txt){ const rr = await ghApi('/contents/' + path + '?ref=' + encodeURIComponent(gh.branch), { raw: true }); txt = await rr.text(); }
        let o = null; try{ o = JSON.parse(txt); }catch(e){}
        if(!valid(o)) throw new Error('el archivo ' + FILE + ' de GitHub no es de MELEE');
        remote = { c: ckMap(o.checks), r: nrMap(o.routines && typeof o.routines === 'object' && !Array.isArray(o.routines) ? o.routines : {}) };
      }
      let base = loadBase(); if(base && !(base.c && typeof base.c === 'object' && 'r' in base)) base = { c: base, r: null };
      const local = snap();
      let merged;
      if(remote && firstMode === 'replace') merged = remote;
      else if(remote) merged = { c: mapMerge(base && base.c, local.c, remote.c), r: mapMerge(base && base.r, local.r, remote.r) };
      else merged = local;
      if(!remote || S(merged) !== S(remote)){
        const body = { message: 'MELEE: ' + new Date().toLocaleString('es-ES'), content: b64enc(S({ format: 'melee-datos', version: 2, updated: new Date().toISOString(), checks: merged.c, routines: merged.r }, null, 1)), branch: gh.branch };
        if(sha) body.sha = sha;
        const p = await ghApi('/contents/' + path, { method: 'PUT', body });
        if(p.status === 409 || p.status === 422) continue;
        if(p.status === 401) throw new Error('la llave no es válida o ha caducado');
        if(p.status === 403 || p.status === 404) throw new Error('GitHub no deja escribir (' + p.status + '). Mira el motivo en el registro de abajo');
        if(!p.ok) throw new Error('escritura ' + p.status);
      }
      lastSync = Date.now();
      if(S(snap()) !== S(local)){ again = true; if(firstMode === 'replace') firstMode = 'merge'; setState('pending'); return; }
      if(S(merged) !== S(local) && window.mlApply) window.mlApply(merged);
      saveBase(merged); firstMode = null;
      setState('ok');
      return;
    }
    throw new Error('conflicto: otro aparato guardó a la vez');
  }catch(e){
    setState(!navigator.onLine ? 'off' : 'err', String(e && e.message || e));
  }finally{
    syncing = false;
    if(again){ again = false; scheduleSync(300); }
  }
}
addEventListener('online', ()=> scheduleSync(200));
addEventListener('offline', ()=> setState('off'));
document.addEventListener('visibilitychange', ()=>{
  if(!ghOk()) return;
  if(document.visibilityState === 'visible'){ if(Date.now() - lastSync > 5000) sync(); }
  else if(state === 'pending'){ clearTimeout(timer); sync(); }
});
addEventListener('pagehide', ()=>{ if(ghOk() && state === 'pending'){ clearTimeout(timer); sync(); } });
setInterval(()=>{ if(ghOk() && document.visibilityState === 'visible' && !syncing && state !== 'pending' && Date.now() - lastSync > 30000) sync(); }, 10000);

/* ---------- panel: conectar con GitHub ---------- */
const panel = document.createElement('div'); panel.id = 'ml-gh'; document.body.appendChild(panel);
function openGh(msg){
  const g = Object.assign(guessFromUrl(), gh || {});
  panel.innerHTML = `<div class="g" role="dialog" aria-label="Guardar en GitHub">
    <h3>☁ Guardar en GitHub</h3>
    <div class="st">${ghOk() ? 'Conectado. <span id="mlg-state"></span><pre id="mlg-trace" style="white-space:pre-wrap;font-size:11px;margin:6px 0 0;opacity:.8"></pre>' : 'Pega tu llave de GitHub y pulsa Conectar. El resto ya viene puesto si abres la app desde tu web.'}</div>
    <label for="mlg-token">Llave (token)</label><input id="mlg-token" type="password" value="${esc(g.token || '')}" placeholder="github_pat_…" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="mlg-owner">Usuario de GitHub</label><input id="mlg-owner" value="${esc(g.owner || '')}" placeholder="tu-usuario" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="mlg-repo">Repositorio</label><input id="mlg-repo" value="${esc(g.repo || '')}" placeholder="nombre-del-repositorio" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="mlg-dir">Carpeta dentro del repositorio (vacío si está en la raíz)</label><input id="mlg-dir" value="${esc(g.dir || '')}" placeholder="vacío" autocomplete="off" spellcheck="false" autocapitalize="off">
    ${msg ? `<div class="er">${esc(msg)}</div>` : ''}
    <div class="rw"><button class="pri" data-g="connect">${ghOk() ? 'Guardar cambios' : 'Conectar'}</button>${ghOk() ? '<button data-g="now">Sincronizar ahora</button><button class="dng" data-g="off">Desconectar este aparato</button>' : ''}<button data-g="close">Cerrar</button></div>
    <details><summary>¿Cómo creo la llave?</summary><ol>
      <li>En GitHub: tu foto → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>
      <li>«Repository access»: Only select repositories → elige el repositorio de MELEE.</li>
      <li>«Permissions» → Repository permissions → <b>Contents: Read and write</b>.</li>
      <li>Generar, copiar la llave (empieza por github_pat_) y pegarla aquí. Hay que hacerlo en cada aparato.</li></ol></details></div>`;
  panel.classList.add('open'); setState(state); note('(panel abierto)');
}
function closeGh(){ panel.classList.remove('open'); panel.innerHTML = ''; }
panel.addEventListener('click', async e=>{
  if(e.target === panel) return closeGh();
  const t = e.target.closest('[data-g]'); if(!t) return;
  const a = t.dataset.g;
  if(a === 'close') return closeGh();
  if(a === 'now'){ note('sincronizando…'); sync(); return; }
  if(a === 'off'){ gh = null; try{ localStorage.removeItem(CFG); localStorage.removeItem(BASEK); }catch(err){} clearTimeout(timer); setState('none'); closeGh(); toast('Este aparato ya no guarda en GitHub'); return; }
  if(a === 'connect'){
    const v = id=> $(id).value.trim();
    const cand = { token: v('#mlg-token'), owner: v('#mlg-owner'), repo: v('#mlg-repo').replace(/\.git$/, ''), dir: v('#mlg-dir').replace(/^\/+|\/+$/g, '') };
    if(gh && gh.api) cand.api = gh.api;
    if(!cand.token || !cand.owner || !cand.repo) return openGh('Faltan la llave, el usuario o el repositorio.');
    t.textContent = 'Comprobando…'; t.disabled = true;
    try{
      const base = cand.api || 'https://api.github.com';
      const r = await fetch(`${base}/repos/${cand.owner}/${cand.repo}`, { headers: { Authorization: 'Bearer ' + cand.token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
      if(r.status === 401) return openGh('La llave no es válida. Cópiala otra vez entera (empieza por github_pat_).');
      if(r.status === 404) return openGh('No encuentro ese repositorio, o la llave no tiene acceso a él. Revisa el usuario, el nombre del repositorio y que lo elegiste al crear la llave.');
      if(!r.ok) return openGh('GitHub ha respondido con un error (' + r.status + '). Prueba otra vez en un momento.');
      const j = await r.json();
      if(j.permissions && !j.permissions.push) return openGh('La llave puede leer pero no escribir. En la llave, el permiso «Contents» tiene que estar en «Read and write».');
      const same = gh && gh.owner === cand.owner && gh.repo === cand.repo && (gh.dir || '') === cand.dir;
      gh = Object.assign({}, cand, { branch: j.default_branch || 'main' });
      localStorage.setItem(CFG, S(gh));
      if(!same) localStorage.removeItem(BASEK);
      firstMode = null;
      if(!loadBase()){
        const fr = await ghApi('/contents/' + dirp() + FILE + '?ref=' + encodeURIComponent(gh.branch));
        if(fr.ok) firstMode = confirm('En GitHub ya hay datos de MELEE guardados.\n\nAceptar: usar en este aparato los de GitHub (lo que haya aquí se sustituye).\nCancelar: juntar lo de este aparato con lo de GitHub.') ? 'replace' : 'merge';
      }
      closeGh(); toast('Conectado con GitHub'); setState('pending'); sync();
    }catch(err){ openGh('No hay conexión con GitHub. Comprueba internet y vuelve a probar.'); }
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && panel.classList.contains('open')) closeGh(); });
cloud.addEventListener('click', ()=> openGh());
setState(ghOk() ? 'pending' : 'none'); if(ghOk()) sync();
window.mlSync = { sync, openGh, state: ()=> state };
})();
</script>
